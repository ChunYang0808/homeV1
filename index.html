<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁跳轉中...</title>
    <style>
        body {
            background-color: #0f172a;
            color: #94a3b8;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #1e293b;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        const NEW_URL = "https://chunyang0808.github.io/home/";

        window.location.replace(NEW_URL);
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <h2>正在為您連線...</h2>
        <p>若網頁沒有自動跳轉，請點擊 <a href="#" id="backupLink" style="color: #38bdf8; text-decoration: underline;">此處</a></p>
    </div>
    <script>
        document.getElementById('backupLink').href = NEW_URL;
    </script>
</body>
</html>
